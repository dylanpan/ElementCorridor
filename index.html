<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>元素合成 - 休闲合成游戏</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ====== 顶部导航栏 ====== -->
  <header id="game-header">
    <div class="header-left">
      <h1 class="game-title">🧪 元素合成</h1>
      <span id="current-level" class="level-badge">第 1 关</span>
    </div>
    <div class="header-center">
    </div>
    <div class="header-right">
      <button id="new-game-btn" class="tool-btn" title="重新开始">🔄 新游戏</button>
      <button id="save-btn" class="tool-btn" title="保存进度">💾 存档</button>
      <button id="load-btn" class="tool-btn" title="读取存档">📂 读档</button>
    </div>
  </header>

  <!-- ====== 主游戏区域 ====== -->
  <main id="game-main">
    <!-- 左侧：关卡信息 + 发射器 -->
    <aside id="left-panel">
      <!-- 经典模式关卡信息 -->
      <section class="panel-section level-info" id="classic-level-info">
        <h3 class="panel-title">📋 关卡信息</h3>
        <p id="level-title" class="level-title-text">第1关 · 初识元素</p>
        <p id="level-description" class="level-desc-text">掌握基础元素的合成与提交</p>
      </section>

      <!-- 肉鸽模式信息（默认隐藏） -->
      <section class="panel-section rogue-level-info" id="rogue-level-info" style="display:none;">
        <div class="version-row">
          <span class="version-badge" id="game-version-badge">v31</span>
        </div>
        <div class="rogue-level-top">
          <span class="rogue-floor-badge" id="rogue-floor-btn" style="cursor:pointer;" title="点击查看历史路线图">🏰 第 <span id="rogue-floor-num">1</span> 层</span>
          <span class="rogue-gold-display">🪙 <span id="rogue-gold">0</span></span>
          <button id="debug-btn" class="debug-btn-side" title="调试工具（开发用）">🔧</button>
        </div>
        <button id="rogue-map-btn-side" class="tool-btn rogue-map-btn" title="查看当前层路线图">🗺 查看路线图</button>
      </section>

      <section class="panel-section emitters-section">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <h3 class="panel-title" style="margin-bottom:0;">🎯 发射器</h3>
          <button id="help-btn" class="small-btn" title="操作说明">❓</button>
        </div>
        <p class="panel-hint">点击发射器产出元素</p>
        <div id="emitters-panel" class="emitters-grid"></div>
      </section>

      <!-- Boss 技能信息（默认隐藏） -->
      <section class="panel-section boss-info-section" id="boss-info-section" style="display:none;">
        <h3 class="panel-title">⚔ Boss 技能</h3>
        <div id="boss-skills-panel" class="boss-skills-list"></div>
      </section>
    </aside>

    <!-- 中间：游戏棋盘 -->
    <section id="board-container">
      <!-- 棋盘上方信息栏：积分进度 + 祝福图标 -->
      <div id="board-top-bar">
        <div id="board-score-area">
          <div class="board-score-row">
            <span class="board-score-label">积分</span>
            <span id="board-score-display" class="board-score-value">0</span>
            <span class="board-score-sep">/</span>
            <span id="board-target-display" class="board-target-value">100</span>
          </div>
          <div class="board-progress-track">
            <div id="board-progress-fill" class="board-progress-fill" style="width:0%"></div>
          </div>
        </div>
        <div id="board-boon-area"></div>
        <!-- 连击显示区 -->
        <div id="board-combo-area">
          <div id="board-combo-display" class="board-combo-display" style="display:none;">
            <span id="board-combo-count-text" class="board-combo-count-text"></span>
            <span id="board-combo-multiplier-text" class="board-combo-multiplier-text"></span>
          </div>
        </div>
      </div>
      <div id="game-board" class="game-board"></div>
    </section>

    <!-- 右侧：订单面板 -->
    <aside id="right-panel">
      <section class="panel-section orders-section">
        <div class="orders-header">
          <h3 class="panel-title">📦 需求订单</h3>
          <button id="refresh-orders-btn" class="small-btn" title="刷新订单（消耗20分）">🔄 刷新</button>
        </div>
        <p class="panel-hint">点击订单提交匹配的元素</p>
        <div id="orders-panel" class="orders-list"></div>
      </section>

      <section class="panel-section rage-section" id="rage-section" style="display:none;">
        <div class="rage-bar-horizontal">
          <span class="rage-bar-icon">⚡</span>
          <div class="rage-bar-h-track">
            <div id="rage-bar-h-fill" class="rage-bar-h-fill" style="width:0%"></div>
          </div>
          <span id="rage-value-h-display" class="rage-value-h-display">0/100</span>
        </div>
        <div class="ultimate-inline-list" id="ultimate-inline-list"></div>
      </section>
    </aside>
  </main>

  <!-- ====== 弹窗遮罩 ====== -->
  <div id="game-overlay" class="game-overlay" style="display:none;">
    <div id="game-modal" class="game-modal">
      <h2 id="modal-title" class="modal-title">提示</h2>
      <div id="modal-body" class="modal-body"></div>
      <div class="modal-footer">
        <button id="modal-btn" class="modal-btn primary">确定</button>
      </div>
    </div>
  </div>

  <!-- ====== 脚本加载 ====== -->
  <!-- ====== 第1层：配置与基础设施（无依赖） ====== -->
  <script src="js/config/gameConfig.js"></script>
  <script src="js/core/EventBus.js"></script>

  <!-- ====== 第2层：实体模型（依赖 config + EventBus） ====== -->
  <script src="js/entities/Element.js"></script>
  <script src="js/entities/Emitter.js"></script>

  <!-- ====== 第3层：系统逻辑（依赖实体） ====== -->
  <script src="js/systems/MergeSystem.js"></script>
  <script src="js/systems/SpawnSystem.js"></script>
  <script src="js/systems/OrderSystem.js"></script>

  <!-- ====== 肉鸽模式系统（依赖 config + EventBus + 实体） ====== -->
  <script src="js/config/rogueConfig.js"></script>
  <script src="js/systems/BoonSystem.js"></script>
  <script src="js/systems/EventSystem.js"></script>
  <script src="js/systems/RogueSystem.js"></script>
  <script src="js/systems/MetaProgress.js"></script>

  <!-- ====== 第4层：核心引擎（依赖所有系统） ====== -->
  <script src="js/core/GameEngine.js"></script>

  <!-- ====== 第5层：UI渲染（依赖引擎） ====== -->
  <script src="js/ui/BoardRenderer.js"></script>
  <script src="js/ui/UIManager.js"></script>
  <script src="js/ui/RogueUIManager.js"></script>

  <!-- ====== 第6层：工具与入口（依赖全部上层） ====== -->
  <script src="js/utils/StorageManager.js"></script>
  <script src="js/utils/DebugTool.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
